<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson on Forms</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">

        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="username" minlength="6" maxlength="20" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="password" minlength="6" maxlength="20" required><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="example@email.com"><br>

        <label for="phone">Phone #:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>  
        
        <label for="bday">Date of Birth:</label>
        <input type="date" id="bday"><br>

        <label for="qty">Quantity:</label>
        <input type="number" id="qty" min="0" max="99" value="1"><br>

        <label for="title">Title:</label>

        <label for="Mr.">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="PhD.">PhD.</label>
        <input type="radio" id="PhD." value="PhD." name="title"><br> 
        
        <label for="payment">payment</label>
        <select id="payment">
            <option value="Visa">Visa</option>
            <option value="Mastercard">Mastercard</option>
            <option value="AMEX">American Express</option>
            <option value="Debit">Debit</option>
        </select><br>

        <label for="subscibe">Subscribe</label>
        <input type="checkbox" id="subscibe"><br> 

        <label for="Comment">Comment</label>
        <textarea id="Comment" rows="3" cols="25"></textarea><br>

        <label for="File">File</label>
        <input type="File" id="File" accept="image/png", "image/jpeg"><br>

        <input type="reset"><br>
        <input type="submit"> 

    </form>
    
</body>
</html>
