<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson on Buttons</title>
</head>
<body>
    
    <button onclick="doSomething()" style="font-size: 25px; box-shadow: 2px; background-color: darkolivegreen; color:black; 
    border-radius: 25px; ">click me</button>
    <p id="greeting">Hello</p>
    <script>
        function doSomething() {
            document.getElementById("greeting").innerHTML = "Goodbye";
         }
    </script>

    <a href="https://en.wikipedia.org/wiki/Cat">
    <button style="font-size:25px; background-color: darkorange; color:black; border-radius: 25px;">click me too!</button>
    </a>
    
</body>
</html>
