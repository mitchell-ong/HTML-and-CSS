<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Wrap Example</title>

    <style>
        .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;

            padding: 10px;
            border: 2px solid black;
        }

        .box {
            width: 120px;
            height: 120px;

            background-color: steelblue;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
    <div class="box">5</div>
    <div class="box">6</div>
</div>

</body>
</html>
