<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Lesson on Image Gallery</title>
</head>
<body>
    <div class = "gallery">
        <a target="_blank" href="images/img_5terre.jpg">
            <img src="images/img_5terre.jpg" alt="Cinque Terre">
        </a>
        <div class="description">Cinque Terre</div>
    </div>
    <div class = "gallery">
        <a target="_blank" href="images/img_forest.jpg">
            <img src="images/img_forest.jpg" alt="Green Forest">
        </a>
        <div class="description">Green Forest</div>
    </div>
    <div class = "gallery">
        <a target="_blank" href="images/img_lights.jpg">
            <img src="images/img_lights.jpg" alt="Northern Lights">
        </a>
        <div class="description">Northern Lights</div>
    </div>
    <div class = "gallery">
        <a target="_blank" href="images/img_mountains.jpg">
            <img src="images/img_mountains.jpg" alt="Mountains">
        </a>
        <div class="description">Mountains</div>
    </div>
</body>
</html>
