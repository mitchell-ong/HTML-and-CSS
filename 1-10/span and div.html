<!DOCTYPE html>
<html lang="en">    
<title>Mitchell's Span & Div</title>
<body>
    <!-- GROUP TOGETHER HTML-->
    <!-- <span> inline container to group elements for styling purposes-->
    <!-- <div> block container to group elements for styling purposes-->    

     <h1><span style="background-color: rgba(118, 160, 118, 0.543);">This is a span title</span></h1>
     <h1><div style="background-color: rgba(155, 157, 226, 0.543);">This is a div title</div></h1>   

     
    <p><span style="background-color: rgba(118, 160, 118, 0.543);">This is a span sentence</span></p>
    <p><div style="background-color: rgba(155, 157, 226, 0.543);">This is a div sentence</div></p>

    

</body>
</html>
