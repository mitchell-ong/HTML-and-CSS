<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Lesson on Tables</title>
</head>
<body>
    <h3>Store Hours</h3>
    <table border="2" style="background-color: rgb(0, 0, 0);">
        <tr align="center" style="background-color: rgb(134, 212, 110);">
            <th width="100">Sunday</th>
            <th width="100">Monday</th>
            <th width="100">Tuesday</th>
            <th width="100">Wednesday</th>
            <th width="100">Thursday</th>
            <th width="100">Friday</th>
            <th width="100">Saturday</th>
        </tr>
        <tr align="center" style="background-color:aliceblue;">
            <td>Closed</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>10-2</td>
        </tr>
    </table>
</body>
